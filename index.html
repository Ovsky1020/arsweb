<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis notas · tu espacio gratuito</title>
  <meta name="description" content="Un espacio de notas estilo Notion. 100% gratuito, sin cuentas, funciona en móvil y ordenador.">
  <meta name="theme-color" id="meta-theme" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232383e2'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='bold'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Aplica el tema guardado antes del primer pintado (evita el "flash")
    try {
      var s = JSON.parse(localStorage.getItem('arsweb.notes.v1') || 'null');
      var t = s && s.theme;
      if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <noscript><p style="padding:24px;font-family:sans-serif">Esta app necesita JavaScript activado para funcionar.</p></noscript>
  <div id="app">
    <aside id="sidebar" class="sidebar" aria-label="Barra lateral">
      <div class="ws-head">
        <span class="ws-logo" aria-hidden="true">✦</span>
        <div class="ws-name">Mis notas<small>gratis · sin cuentas</small></div>
        <button id="btn-collapse" class="icon-btn only-desktop" title="Ocultar barra lateral" aria-label="Ocultar barra lateral">«</button>
      </div>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Buscar…  (Ctrl K)" autocomplete="off" aria-label="Buscar páginas">
      </div>
      <button id="btn-new" class="new-btn">＋&nbsp; Nueva página</button>
      <nav id="page-list" class="page-list" aria-label="Páginas"></nav>
      <div class="side-foot">
        <button id="btn-export" class="link-btn" type="button">⬇ Exportar</button>
        <button id="btn-import" class="link-btn" type="button">⬆ Importar</button>
        <input type="file" id="file-import" accept=".json,application/json" hidden>
        <span class="foot-note">tus datos viven en tu navegador</span>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>
    <main class="main">
      <header class="topbar">
        <button id="btn-menu" class="icon-btn" aria-label="Abrir menú" title="Menú">☰</button>
        <span id="topbar-title" class="topbar-title"></span>
        <span id="save-state" class="save-state" data-state="saved">Guardado ✓</span>
        <span class="spacer"></span>
        <button id="btn-theme" class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
        <button id="btn-topmenu" class="icon-btn" title="Más opciones" aria-label="Más opciones">⋯</button>
      </header>
      <div id="editor" class="editor"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
